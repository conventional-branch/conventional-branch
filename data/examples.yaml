# Valid and invalid branch-name examples, rendered as a table on every
# language's specification page by the `examples` shortcode.
#
# This file is the single source for that table. It used to be written out by
# hand in all eleven content files, where a new branch type meant eleven edits
# and ten chances to forget one. Add a case here once and every language gets
# it; a language missing a translation falls back to English rather than
# dropping the row, so the tables cannot disagree about which examples exist.
#
# `valid` is not decoration: tests/conformance.py asserts every case against
# the regex in static/spec.json, so a case whose verdict is wrong fails CI.

# Table column headers, per language. English is the fallback.
labels:
  branch:
    en: "Branch Name"
    zh: "分支名称"
    zh-hant: "Branch 名稱"
    ja: "ブランチ名"
    de: "Branch-Name"
    es: "Nombre de rama"
    fr: "Nom de branche"
    pl: "Nazwa gałęzi"
    pt-br: "Nome do branch"
    ru: "Имя ветки"
    th: "ชื่อ Branch"
  valid:
    en: "Valid"
    zh: "有效"
    zh-hant: "有效"
    ja: "有効"
    de: "Gültig"
    es: "Válido"
    fr: "Valide"
    pl: "Prawidłowa"
    pt-br: "Válido"
    ru: "Допустимо"
    th: "สถานะ"
  notes:
    en: "Notes"
    zh: "说明"
    zh-hant: "說明"
    ja: "備考"
    de: "Hinweise"
    es: "Notas"
    fr: "Notes"
    pl: "Uwagi"
    pt-br: "Notas"
    ru: "Примечания"
    th: "หมายเหตุ"

# Trailing comments on the ALPHA and DIGIT rules of the ABNF grammar block,
# which the `grammar` shortcode renders from static/spec.json.
grammar:
  alpha:
    en: "lowercase a-z"
    zh: "小写字母 a-z"
    zh-hant: "小寫字母 a-z"
    ja: "小文字 a-z"
    de: "Kleinbuchstaben a-z"
    es: "letras minúsculas a-z"
    fr: "lettres minuscules a-z"
    pl: "małe litery a-z"
    pt-br: "letras minúsculas a-z"
    ru: "строчные буквы a-z"
    th: "lowercase a-z"
  digit:
    en: "0-9"
    zh: "数字 0-9"
    zh-hant: "數字 0-9"
    ja: "数字 0-9"
    de: "Ziffern 0-9"
    es: "dígitos 0-9"
    fr: "chiffres 0-9"
    pl: "cyfry 0-9"
    pt-br: "dígitos 0-9"
    ru: "цифры 0-9"
    th: "0-9"

