intro:
  compact:
    en: "Use these tools to adopt and enforce Conventional Branch in your project:"
    zh: "使用这些工具在你的项目中采用并强制执行约定式分支："
    zh-hant: "使用這些工具在您的專案中採用並強制執行約定式分支："
    pt-br: "Use estas ferramentas para adotar e aplicar Conventional Branch no seu projeto:"
    fr: "Utilisez ces outils pour adopter et appliquer Conventional Branch dans votre projet :"
    ja: "これらのツールを使用して、プロジェクトで慣例的ブランチを導入し、適用できます："
    de: "Verwenden Sie diese Werkzeuge, um Conventional Branch in Ihrem Projekt einzuführen und durchzusetzen:"
    ru: "Используйте эти инструменты, чтобы внедрить и контролировать Conventional Branch в вашем проекте:"
    pl: "Użyj tych narzędzi, aby wdrożyć i egzekwować Conventional Branch w swoim projekcie:"
    es: "Use estas herramientas para adoptar y aplicar Conventional Branch en su proyecto:"
    th: "ใช้เครื่องมือเหล่านี้เพื่อปรับใช้และบังคับใช้ Conventional Branch ในโปรเจกต์ของคุณ:"
  full:
    en: "Conventional Branch can be adopted with local checks, CI validation, editor support, and agent skills:"
install:
  label:
    en: "Install the skill with:"
    zh: "使用以下命令安装该 skill："
    zh-hant: "使用以下指令安裝該 skill："
    pt-br: "Instale a skill com:"
    fr: "Installez la skill avec :"
    ja: "次のコマンドで skill をインストールします："
    de: "Installieren Sie den Skill mit:"
    ru: "Установите skill командой:"
    pl: "Zainstaluj skill poleceniem:"
    es: "Instale la skill con:"
    th: "ติดตั้ง skill ด้วยคำสั่ง:"
  command: "npx skills add conventional-branch/conventional-branch --skill conventional-branch"
items:
  - name: commit-check
    url: https://github.com/commit-check/commit-check
    summary:
      en: Check branch names, commit messages, and related Git metadata locally.
      zh: 在本地检查分支名称、提交信息和相关 Git 元数据。
      zh-hant: 在本機檢查 branch 名稱、commit 訊息與相關 Git metadata。
      pt-br: Verifique nomes de branches, mensagens de commit e metadados Git relacionados localmente.
      fr: Vérifiez localement les noms de branches, les messages de commit et les métadonnées Git associées.
      ja: ブランチ名、コミットメッセージ、関連する Git メタデータをローカルでチェックします。
      de: Prüft Branch-Namen, Commit-Nachrichten und zugehörige Git-Metadaten lokal.
      ru: Локально проверяет имена веток, сообщения коммитов и связанные метаданные Git.
      pl: Lokalnie sprawdza nazwy gałęzi, komunikaty commitów i powiązane metadane Git.
      es: Comprueba localmente los nombres de ramas, mensajes de commit y metadatos Git relacionados.
      th: ตรวจสอบชื่อ branch, ข้อความ commit และ metadata ที่เกี่ยวข้องของ Git ในเครื่อง
    description:
      en: Commit Check supports checking commit messages, branch naming, committer name/email, commit signoff, customizing error messages, suggested commands and more.
  - name: commit-check-action
    url: https://github.com/commit-check/commit-check-action
    summary:
      en: Validate branch names automatically in GitHub Actions.
      zh: 在 GitHub Actions 中自动验证分支名称。
      zh-hant: 在 GitHub Actions 中自動驗證 branch 名稱。
      pt-br: Valide nomes de branches automaticamente no GitHub Actions.
      fr: Validez automatiquement les noms de branches dans GitHub Actions.
      ja: GitHub Actions でブランチ名を自動的に検証します。
      de: Validiert Branch-Namen automatisch in GitHub Actions.
      ru: Автоматически проверяет имена веток в GitHub Actions.
      pl: Automatycznie weryfikuje nazwy galezi w GitHub Actions.
      es: Valida automaticamente los nombres de ramas en GitHub Actions.
      th: ตรวจสอบชื่อ branch โดยอัตโนมัติใน GitHub Actions
    description:
      en: A GitHub Action for checking commit message formatting, branch naming, committer name, email, commit signoff and more.
  - name: VSCode Conventional Branch
    url: https://marketplace.visualstudio.com/items?itemName=pshaddel.conventional-branch
    summary:
      en: Create Conventional Branch names from Visual Studio Code.
      zh: 在 Visual Studio Code 中创建约定式分支名称。
      zh-hant: 在 Visual Studio Code 中建立約定式 branch 名稱。
      pt-br: Crie nomes de branches Conventional Branch no Visual Studio Code.
      fr: Créez des noms de branches Conventional Branch depuis Visual Studio Code.
      ja: Visual Studio Code から慣例的ブランチ名を作成します。
      de: Erstellt Conventional-Branch-Namen aus Visual Studio Code.
      ru: Создаёт имена веток Conventional Branch из Visual Studio Code.
      pl: Tworzy nazwy gałęzi Conventional Branch w Visual Studio Code.
      es: Crea nombres de ramas Conventional Branch desde Visual Studio Code.
      th: สร้างชื่อ branch แบบ Conventional Branch จาก Visual Studio Code
    description:
      en: Customizable Conventional Branch support for Visual Studio Code.
  - name: Conventional Branch Skill
    url: https://github.com/conventional-branch/conventional-branch/blob/main/skills/conventional-branch/SKILL.md
    summary:
      en: Teach AI coding assistants how to create valid Conventional Branch names.
      zh: 教 AI 编程助手创建有效的约定式分支名称。
      zh-hant: 教 AI 程式助理建立有效的約定式 branch 名稱。
      pt-br: Ensine assistentes de programação com IA a criar nomes válidos de Conventional Branch.
      fr: Apprend aux assistants de codage IA à créer des noms de branches Conventional Branch valides.
      ja: AI コーディングアシスタントに有効な慣例的ブランチ名の作成方法を教えます。
      de: Bringt KI-Coding-Assistenten bei, gültige Conventional-Branch-Namen zu erstellen.
      ru: Помогает AI-ассистентам для программирования создавать корректные имена Conventional Branch.
      pl: Uczy asystentów programistycznych AI tworzenia poprawnych nazw Conventional Branch.
      es: Enseña a los asistentes de programación con IA a crear nombres válidos de Conventional Branch.
      th: สอนผู้ช่วยเขียนโค้ด AI ให้สร้างชื่อ branch แบบ Conventional Branch ที่ถูกต้อง
    description:
      en: Agent skill for AI coding assistants.
