# Interface strings and homepage copy for the site's templates.
#
# Hugo falls back to this file for any string a language has not translated, so the
# navigation, sidebar and footer render in every language from day one. The
# homepage sections that carry longer copy (everything under "Homepage" below) are
# shown only for languages whose `landing` param is true in config.yaml: translate
# those strings into i18n/<lang>.yaml first, then turn the flag on, so a page never
# mixes two languages.

