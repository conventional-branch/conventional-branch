why_eyebrow: "Why it exists"
why_statement_muted: "Most teams already have a branch naming habit. It lives in someone’s head, gets explained to every new contributor, and is enforced by hand in code review."
why_statement: "Conventional Branch writes it down once — precisely enough for people to follow and for machines to check."
pillar_people_title: "Readable by people"
pillar_people_body: "A reviewer knows what a branch is for before opening a single file. Nothing to decode, no legend to keep up to date."
pillar_people_note: "a bug fix, in the header"
pillar_machines_title: "Parseable by machines"
pillar_machines_body: "One ABNF grammar and one anchored regular expression, published as JSON. Validating a branch name is a solved problem for every tool."
pillar_machines_note: "types, rules, grammar and the regex"
pillar_pipelines_title: "Actionable by pipelines"
pillar_pipelines_body: "CI/CD, branch protection and review rules key off the prefix directly — no extra metadata, no configuration lookup."
pillar_pipelines_note: "build a release candidate, deploy to staging"

principles_eyebrow: "What we hold to"
principles_title: "Small on purpose. Stable by contract."
principles_title_em: "Open to everyone."
principle_small_title: "Small on purpose"
principle_small_body: "Branches live until they’re merged, so the list stays short enough to remember: {{ .Purposes }} purposes, {{ .Agents }} agents, {{ .Trunks }} trunks. Need another type? Add it — and document it for your team."
principle_stable_title: "Stable by contract"
principle_stable_body: "Each release is frozen the day it’s published. Pin <code>/v{{ .Version }}/spec.json</code> and nothing your tools accept changes until you choose to upgrade. Every 1.0.0 name is still valid."
principle_checked_title: "Checked, not just written"
principle_checked_body: "A conformance suite runs on every pull request. The examples in all {{ .Languages }} languages, the badge, llms.txt and every copy-paste config are tested against spec.json, so none of them can drift."
principle_open_title: "Open infrastructure"
principle_open_body: "Licensed CC BY 4.0: free to use, adapt and translate. Built in the open on GitHub, and kept running by its sponsors and contributors."
principle_agents_title: "Ready for AI agents"
principle_agents_body: "Agents open pull requests now, which makes their branch names your branch names. A shared prefix registry lets reviewers and tools see who wrote what."
principle_commits_title: "A companion to Conventional Commits"
principle_commits_body: "The same idea — human- and machine-readable structure in Git metadata — applied to the branch instead of the commit. The two are designed to be used together."

read_eyebrow: "How it’s read"
