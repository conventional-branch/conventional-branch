name: Check Website URLs

on:
  schedule:
    - cron: '0 */4 * * *' # check every 4 hour
  workflow_dispatch: # manual trigger

permissions:
  contents: read
  issues: write

env:
  # GitHub username assigned to the issue opened when a URL is unreachable.
  ISSUE_ASSIGNEE: shenxianpeng

jobs:
  check-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Check URLs
        id: check
        run: | # add more URLs as needed
          urls=(
            "https://conventionalbranch.org/"
            "https://conventionalbranch.org/#summary"
            "https://conventionalbranch.org/#specification"
            "https://conventionalbranch.org/about/"
            # Served from every adopter's README — a 404 here breaks their badge.
            "https://conventionalbranch.org/badge.svg"
            "https://conventionalbranch.org/de/"
            "https://conventionalbranch.org/es/"
            "https://conventionalbranch.org/fr/"
            "https://conventionalbranch.org/ja/"
            "https://conventionalbranch.org/pl/"
            "https://conventionalbranch.org/pt-br/"
            "https://conventionalbranch.org/ru/"
            "https://conventionalbranch.org/th/"
            "https://conventionalbranch.org/zh/"
            "https://conventionalbranch.org/zh-hant/"
            "https://conventionalbranch.org/v1.0.0/"
          )

          max_retries=3
          retry_delay=15  # seconds between retries
          failed_urls=()

          for url in "${urls[@]}"; do
            echo "Checking $url"
            success=false
            for ((i=1; i<=max_retries; i++)); do
              status=$(curl -o /dev/null -s -w "%{http_code}\n" "$url")
              if [[ "$status" -eq 200 ]]; then
                echo "  OK (HTTP $status)"
                success=true
                break
              fi
              if [[ $i -lt $max_retries ]]; then
                echo "  Attempt $i/$max_retries: HTTP $status - retrying in ${retry_delay}s..."
                sleep $retry_delay
              else
                echo "  Attempt $i/$max_retries: HTTP $status - giving up"
              fi
            done
            if [[ "$success" == false ]]; then
              failed_urls+=("$url (HTTP $status)")
            fi
          done

          if [ ${#failed_urls[@]} -ne 0 ]; then
            echo "has_failed=true" >> "$GITHUB_OUTPUT"
            {
              echo "The following URLs are not reachable:"
              for failed in "${failed_urls[@]}"; do
                echo "- $failed"
              done
            } > issue.txt
          else
            echo "All URLs are reachable."
            echo "has_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Issue if URLs failed
        if: steps.check.outputs.has_failed == 'true'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('issue.txt', 'utf8');
            const title = '🚨 Some URLs are not reachable';
            const assignee = process.env.ISSUE_ASSIGNEE;

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'url-check'
            });

            const alreadyExists = existingIssues.data.some(issue => issue.title === title);
            if (!alreadyExists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                assignees: [assignee],
                labels: ['url-check']
              });
            } else {
              console.log('Issue already exists, skipping creation.');
            }

      - name: Close resolved issues
        if: steps.check.outputs.has_failed == 'false'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9.0.0
        with:
          script: |
            const title = '🚨 Some URLs are not reachable';

            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'url-check'
            });

            for (const issue of existingIssues.filter(issue => issue.title === title && !issue.pull_request)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'All tracked URLs are reachable again — closing automatically.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
