name: Spec conformance

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate every published JSON document parses
        run: |
          python3 - <<'PY'
          import json, pathlib
          static = pathlib.Path("static")
          paths = [static / "spec.json", *static.glob("v*/spec.json"), *static.glob("schema/*/*.json")]
          for path in paths:
              json.load(path.open())
              print(f"ok  {path}")
          PY
      - name: Run conformance tests
        run: python3 tests/conformance.py
