{{- /* A stroke icon, drawn in currentColor.
       Usage: partial "icon.html" (dict "name" "arrow" "size" 16) */ -}}
{{- $name := .name -}}
{{- $size := .size | default 16 -}}
<svg class="icon icon--{{ $name }}" width="{{ $size }}" height="{{ $size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ .stroke | default 2 }}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{{- if eq $name "arrow" }}<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>
{{- else if eq $name "arrow-down" }}<path d="M12 5v14"/><path d="M6 13l6 6 6-6"/>
{{- else if eq $name "chevron" }}<path d="M6 9l6 6 6-6"/>
{{- else if eq $name "globe" }}<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/>
{{- else if eq $name "check" }}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{{- else if eq $name "x" }}<path d="M6 6l12 12"/><path d="M18 6L6 18"/>
{{- else if eq $name "check-circle" }}<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/>
{{- else if eq $name "x-circle" }}<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6"/><path d="M15 9l-6 6"/>
{{- else if eq $name "copy" }}<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>
{{- else if eq $name "menu" }}<path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
{{- else if eq $name "info" }}<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/>
{{- else if eq $name "star" }}<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>
{{- else if eq $name "heart" }}<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>
{{- else if eq $name "edit" }}<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>
{{- else if eq $name "laptop" }}<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>
{{- else if eq $name "server" }}<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01"/><path d="M7 16.5h.01"/>
{{- end -}}
</svg>
